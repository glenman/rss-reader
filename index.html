<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Glenman阅读器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>

:root {
    --sidebar-w: 220px; --sidebar-collapsed-w: 56px; --detail-w: 0px;
    --bg: #f5f5f7; --sidebar-bg: #fff; --card-bg: #fff;
    --text: #1d1d1f; --text2: #6e6e73;
    --accent: #007aff; --border: #e5e5ea; --hover: #f0f0f5;
    --danger: #ff3b30; --success: #34c759;
    --content-bg: #ffffff; --modal-bg: #ffffff; --modal-shadow: rgba(0,0,0,.2);
}
/* 深色模式 */
body.theme-dark {
    --bg: #1c1c1e; --sidebar-bg: #2c2c2e; --card-bg: #2c2c2e;
    --text: #f2f2f7; --text2: #a1a1a6;
    --accent: #0a84ff; --border: #3a3a3c; --hover: #3a3a3c;
    --danger: #ff453a; --success: #32d74b;
    --content-bg: #2c2c2e; --modal-bg: #2c2c2e; --modal-shadow: rgba(0,0,0,.6);
}
/* 护眼模式（豆沙绿） */
body.theme-eye {
    --bg: #c7edcc; --sidebar-bg: #d4f0d8; --card-bg: #e0f5e3;
    --text: #1f3b2d; --text2: #547664;
    --accent: #2d8f5f; --border: #a8d8b0; --hover: #b8e3be;
    --danger: #cc4b37; --success: #3a9d60;
    --content-bg: #e0f5e3; --modal-bg: #e0f5e3; --modal-shadow: rgba(31,59,45,.2);
}
/* 纸质/棕褐色模式 */
body.theme-paper {
    --bg: #f4ecd8; --sidebar-bg: #efe4c9; --card-bg: #f9f2df;
    --text: #3d2b1f; --text2: #7a6652;
    --accent: #8b5a2b; --border: #d9c9a6; --hover: #eadfbf;
    --danger: #b04a3a; --success: #6b8e4e;
    --content-bg: #f9f2df; --modal-bg: #f9f2df; --modal-shadow: rgba(61,43,31,.2);
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica Neue,Arial,sans-serif; background:var(--bg); color:var(--text); height:100vh; overflow:hidden; -webkit-overflow-scrolling: touch; }
.app { display:flex; height:100vh; min-height:-webkit-fill-available; }
.sidebar { width:var(--sidebar-w); min-width:var(--sidebar-w); background:var(--sidebar-bg); border-right:1px solid var(--border); display:flex; flex-direction:column; transition:width .3s ease,min-width .3s ease; }
.sidebar.collapsed { width:var(--sidebar-collapsed-w); min-width:var(--sidebar-collapsed-w); overflow:hidden; }
.sidebar-header { display:flex; align-items:center; padding:12px 16px; gap:8px; border-bottom:1px solid var(--border); transition:padding .3s; }
.sidebar.collapsed .sidebar-header { padding:12px; justify-content:center; }
.sidebar-header span { font-size:16px; font-weight:700; flex:1; transition:opacity .2s; white-space:nowrap; }
.sidebar.collapsed .sidebar-header span { opacity:0; flex:0; width:0; overflow:hidden; }
.sidebar.collapsed .sidebar-search { display:none; }
.sidebar-search { padding:8px 12px; }
.sidebar-search input { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:8px; background:var(--hover); color:var(--text); font-size:13px; outline:none; transition:border-color .2s; }
.sidebar-search input:focus { border-color:var(--accent); }
.sidebar-search input::placeholder { color:var(--text2); }
.sidebar.collapsed .feed-list-wrap { opacity:0; pointer-events:none; }
.sidebar.collapsed #addFeedBtn { display:none; }
#toggleSidebarBtn i { transition:transform .3s; }
.sidebar.collapsed #toggleSidebarBtn i { transform:rotate(180deg); }
.article-search { padding:6px 12px; border:1px solid var(--border); border-radius:8px; background:var(--hover); color:var(--text); font-size:13px; outline:none; width:200px; transition:border-color .2s,width .2s; }
.article-search:focus { border-color:var(--accent); width:250px; }
.article-search::placeholder { color:var(--text2); }
.btn-icon { width:32px; height:32px; border-radius:50%; border:none; background:var(--hover); cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--text); font-size:14px; transition:background .15s; }
.btn-icon:hover { background:var(--border); }
.theme-switch { display:flex; align-items:center; gap:4px; padding:2px 6px; border-radius:18px; background:var(--hover); }
.theme-switch .theme-btn { background:transparent; width:28px; height:28px; font-size:12px; color:var(--text2); opacity:.6; }
.theme-switch .theme-btn:hover { background:var(--border); color:var(--text); opacity:1; }
.theme-switch .theme-btn.active { color:var(--accent); opacity:1; }
.feed-list-wrap { flex:1; overflow-y:auto; padding:8px 0; }
.cat-header { display:flex; align-items:center; padding:10px 16px 4px; cursor:pointer; }
.cat-header span { font-size:13px; font-weight:600; color:var(--text2); flex:1; }
.cat-header .chev { font-size:10px; color:var(--text2); transition:transform .2s; }
.cat-header.open .chev { transform:rotate(90deg); }
.feed-items { display:none; }
.feed-items.open { display:block; }
.feed-item { display:flex; align-items:center; padding:8px 16px; cursor:pointer; gap:10px; transition:background .1s; }
.feed-item:hover { background:var(--hover); }
.feed-item.active { background:var(--hover); border-right:3px solid var(--accent); }
.feed-item .fi-name { flex:1; font-size:12px; font-weight:500; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.feed-item .fi-count { font-size:10px; font-weight:700; min-width:20px; height:18px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--accent); color:#fff; padding:0 5px; }
.feed-item .fi-count.empty { background:var(--border); color:var(--text2); }
.feed-item .fi-actions { display:none; gap:2px; margin-left:auto; }
.feed-item:hover .fi-actions { display:flex; }
.feed-item .fi-actions button { width:20px; height:20px; border:none; background:transparent; cursor:pointer; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:10px; }
.feed-item .fi-actions .del-btn { color:var(--danger); }
.feed-item .fi-actions .move-btn { color:var(--accent); }
.feed-item .fi-actions button:hover { background:var(--border); }
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.content-header { display:flex; align-items:center; padding:12px 20px; gap:12px; border-bottom:1px solid var(--border); background:var(--card-bg); }
.content-header span { font-size:16px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.body-wrap { flex:1; display:flex; overflow:hidden; }
.articles-wrap { flex:1; overflow-y:auto; border-right:1px solid var(--border); max-width:50%; min-width:280px; }
.article-card { padding:16px 20px; border-bottom:1px solid var(--border); cursor:pointer; max-width:800px; margin:0 auto; transition:background .1s; }
.article-card:hover { background:var(--hover); }
.article-card.unread .ac-title { font-weight:700; color:var(--text); }
.article-card.read .ac-title { color:var(--text2); font-weight:400; }
.article-card .ac-title { font-size:16px; line-height:1.4; margin-bottom:4px; }
.article-card .ac-desc { font-size:13px; color:var(--text2); line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; margin-bottom:4px; }
.article-card .ac-meta { font-size:11px; color:var(--text2); display:flex; gap:8px; }
.article-card .ac-src { color:var(--accent); font-weight:600; }
.welcome { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; text-align:center; padding:40px; color:var(--text2); }
.welcome i { font-size:48px; color:var(--border); margin-bottom:16px; }
.hot-topics { padding:24px; height:100%; overflow-y:auto; }
.hot-title { font-size:18px; color:var(--text); margin-bottom:20px; display:flex; align-items:center; gap:8px; }
.hot-title i { color:#ff6b6b; }
.bubble-container { position:relative; min-height:500px; padding:20px; overflow:hidden; }
.hot-bubble { position:absolute; border-radius:50%; color:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px; cursor:pointer; text-align:center; overflow:hidden; animation:bubbleFloatUp linear infinite; box-shadow:0 4px 15px rgba(0,0,0,0.15); opacity:0; }
.hot-bubble:hover { animation-play-state:paused; transform:scale(1.1); box-shadow:0 8px 25px rgba(0,0,0,0.25); }
.hot-bubble .bubble-title { font-weight:700; line-height:1.2; text-align:center; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; text-shadow:0 1px 2px rgba(0,0,0,0.3); }
.hot-bubble .bubble-source { font-size:0.8em; opacity:0.9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:90%; }
.hot-bubble .bubble-time { font-size:0.7em; opacity:0.7; margin-top:2px; }
@keyframes bubbleFloatUp {
    0% { opacity:0; transform:scale(0.3); bottom:-150px; }
    5% { opacity:1; }
    10% { transform:scale(0.6); }
    50% { transform:scale(1); }
    90% { opacity:1; }
    95% { opacity:0.5; bottom:calc(100% - 50px); }
    100% { opacity:0; transform:scale(1.1); bottom:calc(100% + 50px); }
}
.welcome h2 { font-size:20px; color:var(--text); margin-bottom:8px; }
.spinner { text-align:center; padding:40px; color:var(--text2); }
.spinner i { font-size:24px; animation:spin 1s linear infinite; display:block; }
@keyframes spin { to { transform:rotate(360deg); } }
.detail-panel { width:var(--detail-w); min-width:var(--detail-w); background:var(--card-bg); overflow-y:auto; transition:width .25s ease,min-width .25s ease; display:flex; flex-direction:column; }
.detail-panel.open { flex:1; min-width:320px; max-width:60%; }
.detail-header { display:flex; align-items:center; padding:12px 20px; gap:8px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--card-bg); z-index:10; }
.detail-header .dh-title { font-size:14px; font-weight:600; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.detail-body { padding:24px; flex:1; overflow-y:auto; }
.detail-body h1 { font-size:24px; font-weight:700; line-height:1.4; margin-bottom:12px; }
.detail-body .db-content h1 { font-size:inherit; font-weight:inherit; margin:inherit; line-height:inherit; }
.detail-body .db-meta { font-size:13px; color:var(--text2); margin-bottom:20px; display:flex; gap:12px; flex-wrap:wrap; }
.detail-body .db-meta span { display:flex; align-items:center; gap:4px; }
.detail-body .db-content { font-size:16px; line-height:1.8; color:var(--text); }
.detail-body .db-content p { margin-bottom:12px; }
.detail-body .db-content a { color:var(--accent); text-decoration:underline; }
.detail-body .db-content img { max-width:100%; height:auto; border-radius:8px; margin:12px 0; }
.detail-body .db-content blockquote { border-left:3px solid var(--accent); padding-left:16px; margin:16px 0; color:var(--text2); }
.detail-body .db-content h2 { font-size:20px; margin:24px 0 12px; font-weight:700; }
.detail-body .db-content h3 { font-size:17px; margin:20px 0 10px; font-weight:600; }
.detail-body .db-content h4, .detail-body .db-content h5, .detail-body .db-content h6 { font-size:15px; margin:16px 0 8px; font-weight:600; }
.detail-body .db-content ul, .detail-body .db-content ol { padding-left:24px; margin:12px 0; }
.detail-body .db-content code { background:#f0f0f5; padding:2px 6px; border-radius:4px; font-size:14px; }
.detail-body .db-content pre { background:#1d1d1f; color:#f5f5f7; padding:16px; border-radius:8px; overflow-x:auto; margin:16px 0; }
body.theme-dark .detail-body .db-content pre { background:#0f0f10; }
body.theme-eye .detail-body .db-content pre { background:#1f3b2d; color:#d4f0d8; }
body.theme-paper .detail-body .db-content pre { background:#3d2b1f; color:#f4ecd8; }
.detail-body .db-content pre code { background:transparent; color:inherit; padding:0; }
.detail-body .db-source-link { margin-top:24px; padding-top:16px; border-top:1px solid var(--border); }
.detail-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--text2); padding:40px; text-align:center; }
.detail-empty i { font-size:40px; color:var(--border); margin-bottom:12px; }
.modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.4); z-index:200; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal { background:var(--modal-bg); border-radius:16px; padding:24px; width:90%; max-width:400px; box-shadow:0 20px 60px var(--modal-shadow); animation:modalIn .2s ease; }
@keyframes modalIn { from { transform:translateY(20px); opacity:0; } }
.modal h3 { margin-bottom:16px; font-size:18px; }
.modal label { display:block; font-size:13px; font-weight:600; color:var(--text2); margin-bottom:4px; }
.modal input, .modal select { width:100%; padding:10px 12px; border:1px solid var(--border); border-radius:8px; font-size:14px; margin-bottom:12px; outline:none; }
.modal input:focus, .modal select:focus { border-color:var(--accent); }
.modal .btn-row { display:flex; gap:8px; justify-content:flex-end; margin-top:8px; }
.modal .btn { padding:8px 16px; border:none; border-radius:8px; cursor:pointer; font-size:14px; font-weight:600; }
.modal .btn-primary { background:var(--accent); color:#fff; }
.modal .btn-cancel { background:var(--hover); }
.toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:#fff; padding:10px 20px; border-radius:20px; font-size:14px; z-index:300; opacity:0; transition:opacity .3s; pointer-events:none; }
.toast.show { opacity:1; }
.spinning i { animation:spin .5s linear infinite !important; }
@media (max-width:768px) { 
    .sidebar { position:fixed; left:0; top:0; bottom:0; transform:translateX(-100%); z-index:200; height:100%; height:-webkit-fill-available; } 
    .sidebar.open { transform:translateX(0); } 
    .hamburger { display:block; } 
    .detail-panel.open { position:fixed; left:0; right:0; bottom:0; width:100%!important; min-width:100%!important; height:80vh; border-top:1px solid var(--border); z-index:150; border-radius:16px 16px 0 0; } 
    .articles-wrap { max-width:100%; }
    .content-header { padding-left:12px; padding-right:12px; gap:8px; }
    .article-search { width:120px; }
    .article-search:focus { width:160px; }
    .theme-switch { gap:2px; padding:2px 4px; }
    .theme-switch .theme-btn { width:24px; height:24px; font-size:11px; }
}

@supports (-webkit-touch-callout: none) {
    body { height: -webkit-fill-available; }
    .app { height: -webkit-fill-available; }
    .sidebar { height: -webkit-fill-available; }
}

</style>
</head>
<body>
<div class="app">
<div class="sidebar" id="sidebar">
<div class="sidebar-header">
<button class="btn-icon" id="toggleSidebarBtn" title="折叠/展开"><i class="fas fa-angle-left"></i></button>
<span>主题分类</span>
<button class="btn-icon" id="addFeedBtn" title="添加订阅源"><i class="fas fa-plus"></i></button>
</div>
<div class="sidebar-search">
<input type="text" id="searchFeeds" placeholder="搜索订阅源..." />
</div>
<div class="feed-list-wrap" id="feedList"></div>
</div>
<div class="main">
<div class="content-header">
<button class="btn-icon hamburger" id="menuBtn"><i class="fas fa-bars"></i></button>
<span id="contentTitle">Glenman阅读器</span>
<button class="btn-icon" id="backToHomeBtn" title="回到首页" style="display:none"><i class="fas fa-home"></i></button>
<div class="theme-switch" id="themeSwitch" title="切换主题">
<button class="btn-icon theme-btn" data-theme="light" title="日间"><i class="fas fa-sun"></i></button>
<button class="btn-icon theme-btn" data-theme="dark" title="夜间"><i class="fas fa-moon"></i></button>
<button class="btn-icon theme-btn" data-theme="eye" title="护眼"><i class="fas fa-leaf"></i></button>
<button class="btn-icon theme-btn" data-theme="paper" title="纸质"><i class="fas fa-scroll"></i></button>
</div>
<input type="text" id="searchArticles" class="article-search" placeholder="搜索新闻标题..." />
<button class="btn-icon" id="refreshBtn" title="刷新"><i class="fas fa-sync-alt"></i></button>
</div>
<div class="body-wrap">
<div class="articles-wrap" id="articlesWrap">
<div class="welcome">
<i class="fas fa-rss"></i>
<h2>Welcome to Glenman阅读器</h2>
<p>Select a feed from the sidebar or add a new one.</p>
</div>
</div>
<div class="detail-panel" id="detailPanel">
<div class="detail-empty" id="detailEmpty">
<i class="fas fa-file-alt"></i>
<p>Click an article to read</p>
</div>
<div class="detail-header" id="detailHeader" style="display:none">
<button class="btn-icon" id="closeDetailBtn" title="Close"><i class="fas fa-times"></i></button>
<span class="dh-title" id="detailTitle"></span>
</div>
<div class="detail-body" id="detailBody" style="display:none"></div>
</div>
</div>
</div>
</div>
<div class="modal-overlay" id="addFeedModal">
<div class="modal">
<h3>Add Feed</h3>
<form id="addFeedForm">
<label>RSS URL</label>
<input type="url" id="feedUrl" required placeholder="https://example.com/feed.xml">
<label>Category</label>
<select id="feedCategory"></select>
<label>Name (optional)</label>
<input type="text" id="feedName" placeholder="Leave empty to auto-fetch">
<div class="btn-row">
<button type="button" class="btn btn-cancel" onclick="document.getElementById('addFeedModal').classList.remove('show')">Cancel</button>
<button type="submit" class="btn btn-primary">Add</button>
</div>
</form>
</div>
</div>
<div class="toast" id="toast"></div>
<script>

];

function save(){
    localStorage.setItem(STORAGE_FEEDS,JSON.stringify(feeds));
    localStorage.setItem(STORAGE_ARTICLES,JSON.stringify(articles));
    localStorage.setItem(STORAGE_READ,JSON.stringify([...readIds]));
}
function genId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function cleanHtml(s){ if(!s)return ""; return s.replace(/<[^>]*>/g,"").trim().slice(0,200); }
function timeAgo(ds){
    if(!ds)return ""; const d=new Date(ds); if(isNaN(d))return ds.slice(0,10);
    const s=Math.floor((Date.now()-d.getTime())/1000);
    if(s<60)return "just now"; if(s<3600)return Math.floor(s/60)+"m ago";
    if(s<86400)return Math.floor(s/3600)+"h ago"; if(s<2592000)return Math.floor(s/86400)+"d ago";
    return d.toLocaleDateString();
}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2500);}
function unreadCount(fid){return articles.filter(a=>a.feedId===fid&&!readIds.has(a.id)).length;}

function load(){
    feeds=JSON.parse(localStorage.getItem(STORAGE_FEEDS)||"[]");
    articles=JSON.parse(localStorage.getItem(STORAGE_ARTICLES)||"[]");
    readIds=new Set(JSON.parse(localStorage.getItem(STORAGE_READ)||"[]"));
    if(!feeds.length){feeds=DEFAULT_FEEDS;save();}
    renderFeedList();renderArticles();updateStats();
}

function renderFeedList(){
    const cats={};feeds.forEach(f=>{if(!cats[f.category])cats[f.category]=[];cats[f.category].push(f);});
    let h="";
    for(const[cat,items]of Object.entries(cats)){
        h+=`<div class="cat-header" data-cat="${cat}"><span>${cat}</span><i class="fas fa-chevron-right chev"></i></div><div class="feed-items" data-cat="${cat}">`;
        items.forEach(f=>{
            const c=unreadCount(f.id),act=f.id===currentFeedId?" active":"";
            h+=`<div class="feed-item${act}" data-id="${f.id}"><span class="fi-name">${esc(f.title)}</span><span class="fi-count ${c?'':'empty'}">${c||''}</span><div class="fi-actions"><button class="move-btn" title="Move" onclick="event.stopPropagation();moveFeed('${f.id}')"><i class="fas fa-arrows-alt"></i></button><button class="del-btn" title="Delete" onclick="event.stopPropagation();deleteFeed('${f.id}')"><i class="fas fa-trash"></i></button></div></div>`;
        });
        h+="</div>";
    }
    document.getElementById("feedList").innerHTML=h;
    document.querySelectorAll(".cat-header").forEach(el=>{el.addEventListener("click",()=>{el.classList.toggle("open");el.nextElementSibling.classList.toggle("open");});});
    document.querySelectorAll(".feed-item").forEach(el=>{el.addEventListener("click",()=>selectFeed(el.dataset.id));});
}

let searchQuery="";

function filterFeeds(){
    searchQuery=document.getElementById("searchFeeds").value.toLowerCase().trim();
    renderFeedList();
}

function renderFeedList(){
    const cats={};
    const filteredFeeds=searchQuery?feeds.filter(f=>f.title.toLowerCase().includes(searchQuery)):feeds;
    filteredFeeds.forEach(f=>{if(!cats[f.category])cats[f.category]=[];cats[f.category].push(f);});
    let h="";
    for(const[cat,items]of Object.entries(cats)){
        h+=`<div class="cat-header" data-cat="${cat}"><span>${cat}</span><i class="fas fa-chevron-right chev"></i></div><div class="feed-items" data-cat="${cat}">`;
        items.forEach(f=>{
            const c=unreadCount(f.id),act=f.id===currentFeedId?" active":"";
            h+=`<div class="feed-item${act}" data-id="${f.id}"><span class="fi-name">${esc(f.title)}</span><span class="fi-count ${c?'':'empty'}">${c||''}</span><div class="fi-actions"><button class="move-btn" title="Move" onclick="event.stopPropagation();moveFeed('${f.id}')"><i class="fas fa-arrows-alt"></i></button><button class="del-btn" title="Delete" onclick="event.stopPropagation();deleteFeed('${f.id}')"><i class="fas fa-trash"></i></button></div></div>`;
        });
        h+="</div>";
    }
    document.getElementById("feedList").innerHTML=h;
    document.querySelectorAll(".cat-header").forEach(el=>{el.addEventListener("click",()=>{el.classList.toggle("open");el.nextElementSibling.classList.toggle("open");});});
    document.querySelectorAll(".feed-item").forEach(el=>{el.addEventListener("click",()=>selectFeed(el.dataset.id));});
}

function selectFeed(fid){
    currentFeedId=fid;
    const f=feeds.find(x=>x.id===fid);
    document.getElementById("contentTitle").textContent=f?f.title:"Glenman阅读器";
    renderArticles();renderFeedList();
    if(window.innerWidth<=768)document.getElementById("sidebar").classList.remove("open");
}

let articleSearchQuery="";

function filterArticles(){
    articleSearchQuery=document.getElementById("searchArticles").value.toLowerCase().trim();
    renderArticles();
}

function renderArticles(){
    const wrap=document.getElementById("articlesWrap");
    if(!currentFeedId){
        // 显示热点头条气泡 - 优先显示未读，没有未读则显示所有文章
        const displayArticles=articles.filter(a=>!readIds.has(a.id)).length>0
            ? articles.filter(a=>!readIds.has(a.id))
            : articles;
        const hotArticles=displayArticles.sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate)).slice(0,8);
        if(hotArticles.length){
            const allUnread=articles.filter(a=>!readIds.has(a.id)).length;
            const unreadCount=articles.filter(a=>!readIds.has(a.id)).length;
            let h='<div class="hot-topics"><h2 class="hot-title"><i class="fas fa-fire"></i> 热点速递</h2>';
            if(unreadCount>0) h+='<p class="hot-subtitle">'+unreadCount+' 篇未读</p>';
            h+='<div class="bubble-container">';
            const colors=[
                {bg:"#7c9eb2",text:"#fff"},{bg:"#a8b5a0",text:"#fff"},{bg:"#b5a08a",text:"#fff"},
                {bg:"#9b8aa8",text:"#fff"},{bg:"#8a9ba0",text:"#fff"},{bg:"#a09080",text:"#fff"},
                {bg:"#7d9b8a",text:"#fff"},{bg:"#8a8a9b",text:"#fff"},{bg:"#9b9b8a",text:"#fff"},
                {bg:"#8a9b9b",text:"#fff"},{bg:"#9b8a9b",text:"#fff"},{bg:"#a0a080",text:"#fff"}
            ];
            const maxLeft=85;
            const usedPositions=[];
            hotArticles.forEach((a,i)=>{
                const size=Math.max(60,Math.min(100,65+Math.random()*35));
                const color=colors[i%colors.length];
                let left;
                let attempts=0;
                const minSpacing=8; // 最小间距百分比
                do{
                    left=5+Math.random()*maxLeft;
                    attempts++;
                } while(attempts<20&&usedPositions.some(pos=>Math.abs(pos-left)<minSpacing));
                usedPositions.push(left);
                const duration=15+Math.random()*10;
                const delay=Math.random()*15;
                const feed=feeds.find(f=>f.id===a.feedId);
                h+=`<div class="hot-bubble" data-id="${a.id}" style="width:${size}px;height:${size}px;font-size:${Math.max(12,size/8)}px;background:${color.bg};color:${color.text};left:${left}%;bottom:-${size}px;animation-delay:${delay}s;animation-duration:${duration}s">
                    <span class="bubble-title">${esc(a.title.slice(0,12))}</span>
                </div>`;
            });
            h+='</div></div>';
            wrap.innerHTML=h;
            wrap.querySelectorAll(".hot-bubble").forEach(el=>{
                el.addEventListener("click",()=>{
                    const art=articles.find(a=>a.id===el.dataset.id);
                    if(art){readIds.add(art.id);save();renderArticles();renderFeedList();openArticle(art);}
                });
            });
        } else {
            wrap.innerHTML='<div class="welcome"><i class="fas fa-rss"></i><h2>Welcome to Glenman阅读器</h2><p>Select a feed from the sidebar or click refresh to load articles.</p></div>';
        }
        return;
    }
    let fa=articles.filter(a=>a.feedId===currentFeedId);
    if(articleSearchQuery){
        fa=fa.filter(a=>a.title.toLowerCase().includes(articleSearchQuery));
    }
    fa=fa.sort((a,b)=>new Date(b.pubDate)-new Date(a.pubDate));
    if(!fa.length){
        const msg=articleSearchQuery?'<p>No articles found matching your search.</p>':'<p>No articles. Click refresh to fetch.</p>';
        wrap.innerHTML='<div class="spinner"><i class="fas fa-spinner"></i>'+msg+'</div>';
        return;
    }
    let h="";
    fa.forEach(a=>{
        const rd=readIds.has(a.id);
        h+=`<div class="article-card ${rd?'read':'unread'}" data-id="${a.id}"><div class="ac-title">${esc(a.title)}</div><div class="ac-desc">${cleanHtml(a.description||a.content||"")}</div><div class="ac-meta"><span class="ac-src">${esc(a.feedTitle||"")}</span><span>${timeAgo(a.pubDate)}</span></div></div>`;
    });
    wrap.innerHTML=h;
    wrap.querySelectorAll(".article-card").forEach(el=>{
        el.addEventListener("click",()=>{
            const art=articles.find(a=>a.id===el.dataset.id);
            if(art){readIds.add(art.id);save();renderArticles();renderFeedList();openArticle(art);}
        });
    });
}

function openArticle(art){
    const panel=document.getElementById("detailPanel");
    const header=document.getElementById("detailHeader");
    const body=document.getElementById("detailBody");
    const empty=document.getElementById("detailEmpty");
    empty.style.display="none";
    header.style.display="flex";
    body.style.display="block";
    document.getElementById("detailTitle").textContent=art.title;
    let content="";
    if(art.enclosure&&art.enclosure.link){
        content+=`<img src="${esc(art.enclosure.link)}" onerror="this.style.display='none'">`;
    }
    if(art.description) content+=art.description;
    if(art.content&&art.content!==art.description) content+=art.content;
    body.innerHTML=`<h1>${esc(art.title)}</h1><div class="db-meta"><span><i class="fas fa-newspaper"></i> ${esc(art.feedTitle||"")}</span><span><i class="far fa-clock"></i> ${timeAgo(art.pubDate)}</span></div><div class="db-content">${content}</div><div class="db-source-link"><a href="${esc(art.link)}" target="_blank" rel="noopener"><i class="fas fa-external-link-alt"></i> 访问原文</a></div>`;
    panel.classList.add("open");
}
function closeArticle(){
    document.getElementById("detailPanel").classList.remove("open");
    document.getElementById("detailHeader").style.display="none";
    document.getElementById("detailBody").style.display="none";
    document.getElementById("detailEmpty").style.display="flex";
}

function updateStats(){
    const total=articles.length,unread=articles.filter(a=>!readIds.has(a.id)).length;
    const title=currentFeedId?(feeds.find(f=>f.id===currentFeedId)||{}).title||"Glenman阅读器":"Glenman阅读器 ("+total+" articles, "+unread+" unread)";
    document.getElementById("contentTitle").textContent=title;
    // Show/hide back to home button
    const backBtn=document.getElementById("backToHomeBtn");
    if(backBtn) backBtn.style.display=currentFeedId?"flex":"none";
}

async function fetchFeed(feed){
    try{const r=await fetch(API_URL+encodeURIComponent(feed.url));const d=await r.json();if(d.status!=="ok")return[];return d.items||[];}
    catch(e){console.error("Fetch fail:",feed.title,e);return[];}
}

async function refreshFeeds(){
    if(refreshing)return;refreshing=true;
    document.getElementById("refreshBtn").classList.add("spinning");
    let added=0;
    for(let i=0;i<feeds.length;i+=MAX_CONCURRENT){
        const batch=feeds.slice(i,i+MAX_CONCURRENT);
        const results=await Promise.all(batch.map(fetchFeed));
        results.forEach((items,idx)=>{
            const feed=batch[idx];
            items.forEach(item=>{
                if(!articles.find(a=>a.link===item.link)){
                    articles.push({id:genId(),feedId:feed.id,feedTitle:feed.title,title:item.title,link:item.link,pubDate:item.pubDate||new Date().toISOString(),description:item.description||item.content||"",isRead:false});
                    added++;
                }
            });
        });
    }
    save();refreshing=false;
    document.getElementById("refreshBtn").classList.remove("spinning");
    renderFeedList();if(currentFeedId)renderArticles();updateStats();
    toast("Refreshed, added "+added+" articles");
}

function deleteFeed(id){
    if(!confirm("Delete this feed?"))return;
    feeds=feeds.filter(f=>f.id!==id);save();
    if(currentFeedId===id){currentFeedId=null;document.getElementById("contentTitle").textContent="Glenman阅读器";}
    renderFeedList();renderArticles();updateStats();
}

function moveFeed(id){
    const cat=prompt("Enter new category name:");
    if(cat){const f=feeds.find(x=>x.id===id);if(f){f.category=cat;save();renderFeedList();toast("Moved");}}
}

function esc(s){if(!s)return"";const d=document.createElement("div");d.textContent=s;return d.innerHTML;}

document.getElementById("addFeedBtn").addEventListener("click",()=>{
    const sel=document.getElementById("feedCategory");
    const cats=[...new Set(feeds.map(f=>f.category))];
    sel.innerHTML=cats.map(c=>'<option>'+c+'</option>').join('')+'<option value="__new__">+ New Category</option>';
    document.getElementById("addFeedModal").classList.add("show");
});

document.getElementById("addFeedForm").addEventListener("submit",async e=>{
    e.preventDefault();
    const url=document.getElementById("feedUrl").value;
    const catSel=document.getElementById("feedCategory").value;
    const name=document.getElementById("feedName").value||"";
    const cat=catSel==="__new__"?prompt("New category name:")||"AI":catSel;
    feeds.push({id:genId(),title:name||url,url:url,category:cat});
    save();document.getElementById("addFeedModal").classList.remove("show");
    document.getElementById("addFeedForm").reset();renderFeedList();await refreshFeeds();
    toast("Feed added");
});

document.getElementById("menuBtn").addEventListener("click",()=>{document.getElementById("sidebar").classList.toggle("open");document.getElementById("sidebar").classList.toggle("pinned");});
document.getElementById("refreshBtn").addEventListener("click",refreshFeeds);
document.getElementById("closeDetailBtn").addEventListener("click",closeArticle);

// Theme switching
(function(){
    const THEMES=["light","dark","eye","paper"];
    const CLASS_MAP={dark:"theme-dark",eye:"theme-eye",paper:"theme-paper"};
    const STORAGE_KEY="rss_theme";
    function apply(theme){
        if(!THEMES.includes(theme)) theme="light";
        Object.values(CLASS_MAP).forEach(c=> document.body.classList.remove(c));
        if(CLASS_MAP[theme]) document.body.classList.add(CLASS_MAP[theme]);
        document.querySelectorAll(".theme-btn").forEach(b=>{
            b.classList.toggle("active", b.dataset.theme===theme);
        });
        try{ localStorage.setItem(STORAGE_KEY,theme);}catch(e){}
    }
    document.querySelectorAll(".theme-btn").forEach(b=>{
        b.addEventListener("click",()=> apply(b.dataset.theme));
    });
    const saved = (()=>{try{return localStorage.getItem(STORAGE_KEY);}catch(e){return null;}})();
    apply(saved||"light");
})();

// Sidebar auto-collapse on desktop: hover to expand, auto hide when mouse leaves
(function(){
    const sb = document.getElementById("sidebar");
    const toggleBtn = document.getElementById("toggleSidebarBtn");
    const isMobile = ()=> window.innerWidth <= 768;
    let hideTimer = null;
    function expand(){ if(isMobile()) return; sb.classList.remove("collapsed"); if(hideTimer){ clearTimeout(hideTimer); hideTimer=null; } }
    function collapse(){ if(isMobile()) return; sb.classList.add("collapsed"); }
    function scheduleCollapse(){ if(isMobile()) return; if(sb.classList.contains("pinned")) return; if(hideTimer) return; hideTimer = setTimeout(()=> sb.classList.add("collapsed"), 600); }
    sb.addEventListener("mouseenter", expand);
    sb.addEventListener("mouseleave", scheduleCollapse);
    // toggle button: click to expand/collapse, when expanded set pinned to prevent auto-hide
    toggleBtn.addEventListener("click", (e)=>{
        e.stopPropagation();
        if(sb.classList.contains("collapsed")){
            sb.classList.remove("collapsed");
            sb.classList.add("pinned");
        } else {
            sb.classList.add("collapsed");
            sb.classList.remove("pinned");
        }
    });
    // start collapsed on desktop
    if(!isMobile()){ sb.classList.add("collapsed"); scheduleCollapse(); }
})();

document.getElementById("addFeedModal").addEventListener("click",function(e){if(e.target===this)this.classList.remove("show");});

document.getElementById("searchFeeds").addEventListener("input", filterFeeds);

document.getElementById("searchArticles").addEventListener("input", filterArticles);

load();

setInterval(refreshFeeds,30*60*1000);
